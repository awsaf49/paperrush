name: Update Conference Deadlines

on:
  # Run weekly on Mondays at 6 AM UTC
  schedule:
    - cron: '0 6 * * 1'

  # Trigger on push if commit message contains [scrape]
  push:
    branches:
      - main

  # Allow manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      conferences:
        description: 'Conferences to scrape (comma-separated, or "all")'
        required: false
        default: 'all'
      year:
        description: 'Conference year (blank uses current UTC year)'
        required: false
        default: ''

env:
  # All conferences supported by the scraper
  ALL_CONFERENCES: 'cvpr,iccv,eccv,wacv,icip,bmvc,3dv,miccai,icml,neurips,iclr,aaai,aistats,ijcai,mlsys,colt,kdd,acl,eacl,emnlp,naacl,interspeech,icassp,iros,icra,corl'

# Grant write permissions to push commits
permissions:
  contents: write
  issues: write

jobs:
  update-deadlines:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: update-conference-deadlines
      cancel-in-progress: false
    # Skip if push event and commit message doesn't contain [scrape]
    if: |
      github.event_name != 'push' ||
      contains(github.event.head_commit.message, '[scrape]')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests openai playwright html2text google-genai
          playwright install chromium

      - name: Run rollover regression tests
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          node --test tests/*.test.js

      - name: Determine conferences to scrape
        id: config
        run: |
          if [ "${{ github.event.inputs.conferences }}" = "all" ] || [ -z "${{ github.event.inputs.conferences }}" ]; then
            echo "conferences=${{ env.ALL_CONFERENCES }}" >> $GITHUB_OUTPUT
          else
            echo "conferences=${{ github.event.inputs.conferences }}" >> $GITHUB_OUTPUT
          fi

          if [ -z "${{ github.event.inputs.year }}" ]; then
            echo "year=$(date -u +%Y)" >> $GITHUB_OUTPUT
          else
            echo "year=${{ github.event.inputs.year }}" >> $GITHUB_OUTPUT
          fi

      - name: Run scraper for each conference
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          mkdir -p /tmp/scraped

          # Split conferences by comma
          IFS=',' read -ra CONFS <<< "${{ steps.config.outputs.conferences }}"

          for conf in "${CONFS[@]}"; do
            conf=$(echo "$conf" | xargs)  # Trim whitespace
            echo "=================================================="
            echo "Scraping: $conf (year: ${{ steps.config.outputs.year }})"
            echo "=================================================="

            python scripts/scraper.py "$conf" \
              --year ${{ steps.config.outputs.year }} \
              --output "/tmp/scraped/${conf}.json" \
              --gemini || echo "Warning: Failed to scrape $conf"

            # Small delay between conferences to avoid rate limiting
            sleep 2
          done

          echo ""
          echo "Scraped files:"
          ls -la /tmp/scraped/

      - name: Convert and quarantine invalid updates
        id: convert
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          IFS=',' read -ra CONFS <<< "${{ steps.config.outputs.conferences }}"
          SCRAPED_FILES=()
          for conf in "${CONFS[@]}"; do
            conf=$(echo "$conf" | xargs)
            if [ -n "$conf" ]; then
              SCRAPED_FILES+=("/tmp/scraped/${conf}.json")
            fi
          done

          if [ "${#SCRAPED_FILES[@]}" -eq 0 ]; then
            echo "No conferences were configured. Exiting."
            exit 1
          fi

          printf 'Converting: %s\n' "${SCRAPED_FILES[@]}"

          python scripts/apply_scraped_updates.py \
            --input "${SCRAPED_FILES[@]}" \
            --output js/data.js \
            --report /tmp/update-report.json

      - name: Validate published conference data
        run: python scripts/validate_data.py js/data.js

      - name: Generate crawlable conference pages
        run: node scripts/generate_conference_pages.js

      # Re-run browser/data contract tests against the newly generated file,
      # not only the pre-scrape checkout.
      - name: Test generated browser data
        run: node --test tests/*.test.js

      - name: Upload scrape diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: conference-scrape-${{ github.run_id }}
          path: |
            /tmp/scraped
            /tmp/update-report.json
            js/data.js
            conferences
            sitemap.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Check for changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain -- js/data.js conferences sitemap.xml)" ]; then
            echo "No published data or page changes"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Published data or generated pages changed"
            echo "has_changes=true" >> $GITHUB_OUTPUT
            git status --short -- js/data.js conferences sitemap.xml
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add js/data.js conferences sitemap.xml
          git commit -m "chore: update conference deadlines [automated]

          Updated conferences: ${{ steps.config.outputs.conferences }}
          Year: ${{ steps.config.outputs.year }}

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Summary
        if: always()
        run: |
          echo "## Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Conferences scraped:** ${{ steps.config.outputs.conferences }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Year:** ${{ steps.config.outputs.year }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Accepted updates:** ${{ steps.convert.outputs.accepted }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Unchanged updates:** ${{ steps.convert.outputs.unchanged }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Rejected updates:** ${{ steps.convert.outputs.rejected }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Changes detected:** ${{ steps.changes.outputs.has_changes }}" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.changes.outputs.has_changes }}" = "true" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "data.js was updated and pushed to main branch." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "GitHub Pages will automatically deploy the changes." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Notify updater health
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          REJECTED: ${{ steps.convert.outputs.rejected }}
          REJECTED_COUNT: ${{ steps.convert.outputs.rejected_count }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          title="[automation] PaperRush updater needs attention"
          issue_number=$(
            gh issue list --state open --limit 100 --json number,title \
              --jq '.[] | select(.title == "[automation] PaperRush updater needs attention") | .number' \
              | head -n 1
          )

          if [ "$JOB_STATUS" != "success" ] || \
             { [ -n "$REJECTED_COUNT" ] && [ "$REJECTED_COUNT" != "0" ]; }; then
            cat > /tmp/paperrush-updater-alert.md <<EOF
          The automated conference refresh needs attention.

          - Run: $RUN_URL
          - Job status: $JOB_STATUS
          - Rejected updates: ${REJECTED:-not available}

          Invalid candidates were not published. Valid conference updates remain isolated from rejected ones, and the last known-good data stays live.
          EOF

            if [ -n "$issue_number" ]; then
              gh issue comment "$issue_number" --body-file /tmp/paperrush-updater-alert.md
            else
              gh issue create \
                --title "$title" \
                --body-file /tmp/paperrush-updater-alert.md \
                --assignee "$REPOSITORY_OWNER"
            fi
          elif [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" \
              --body "Recovered in $RUN_URL. The updater completed with no rejected conference updates."
            gh issue close "$issue_number" --reason completed
          fi
