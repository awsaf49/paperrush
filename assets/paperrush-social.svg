<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">PaperRush conference deadline tracker</title>
  <desc id="desc">PaperRush helps AI researchers catch paper, abstract, and conference deadlines without stale editions.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfcff"/>
      <stop offset="0.56" stop-color="#f5f7fb"/>
      <stop offset="1" stop-color="#f9edf2"/>
    </linearGradient>
    <linearGradient id="rush" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5d4d"/>
      <stop offset="0.58" stop-color="#f69c2b"/>
      <stop offset="1" stop-color="#dc735a"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.64"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#30334e" flood-opacity="0.17"/>
    </filter>
    <style>
      @font-face { font-family: Outfit; src: url('fonts/outfit-latin-variable.woff2'); font-weight: 300 900; }
      @font-face { font-family: JetBrains; src: url('fonts/jetbrains-mono-latin-variable.woff2'); font-weight: 400 700; }
      .outfit { font-family: Outfit, sans-serif; }
      .mono { font-family: JetBrains, monospace; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#background)"/>
  <circle cx="1080" cy="-30" r="260" fill="#f1dff4" opacity="0.72"/>
  <circle cx="1080" cy="-30" r="205" fill="none" stroke="#ff5d4d" stroke-opacity="0.16" stroke-width="2"/>
  <circle cx="116" cy="610" r="190" fill="#dbeafe" opacity="0.64"/>

  <g transform="translate(76 62)">
    <circle cx="16" cy="16" r="15" fill="#fff" stroke="#17182b" stroke-width="3"/>
    <rect x="12" y="-3" width="8" height="5" rx="2" fill="#17182b"/>
    <path d="M16 16 23 7" stroke="#ff5d4d" stroke-width="2.5" stroke-linecap="round"/>
    <text x="44" y="24" class="outfit" fill="#17182b" font-size="30" font-weight="650" letter-spacing="-1">Paper<tspan fill="#ff5d4d" font-weight="760">Rush</tspan></text>
  </g>

  <g transform="translate(76 146)">
    <text class="outfit" fill="#b54738" font-size="17" font-weight="760" letter-spacing="3">AI CONFERENCE DEADLINE TRACKER</text>
    <text y="82" class="outfit" fill="#17182b" font-size="74" font-weight="760" letter-spacing="-5">Catch the deadline.</text>
    <text y="154" class="outfit" fill="url(#rush)" font-size="74" font-weight="760" letter-spacing="-5">Skip the panic.</text>
    <text y="207" class="outfit" fill="#60616c" font-size="22" font-weight="430">Live paper, abstract, and conference dates.</text>
    <text y="238" class="outfit" fill="#60616c" font-size="22" font-weight="430">Official sources. Estimates clearly marked.</text>
  </g>

  <g transform="translate(690 166)" filter="url(#shadow)">
    <rect width="434" height="315" rx="30" fill="url(#glass)" stroke="#fff" stroke-width="2"/>
    <circle cx="31" cy="38" r="6" fill="#ff5d4d"/>
    <circle cx="31" cy="38" r="12" fill="#ff5d4d" opacity="0.12"/>
    <text x="52" y="44" class="outfit" fill="#71727d" font-size="15" font-weight="700" letter-spacing="1.8">YOUR DEADLINE GRID</text>

    <g transform="translate(26 84)">
      <rect width="382" height="58" rx="16" fill="#fff" fill-opacity="0.76" stroke="#17182b" stroke-opacity="0.06"/>
      <circle cx="25" cy="29" r="7" fill="#ef4444"/>
      <text x="45" y="25" class="outfit" fill="#17182b" font-size="21" font-weight="700">ICLR</text>
      <text x="45" y="43" class="outfit" fill="#777883" font-size="13">Machine Learning</text>
      <text x="356" y="35" text-anchor="end" class="mono" fill="#17182b" font-size="18" font-weight="650">PAPER</text>
    </g>
    <g transform="translate(26 153)">
      <rect width="382" height="58" rx="16" fill="#fff" fill-opacity="0.76" stroke="#17182b" stroke-opacity="0.06"/>
      <circle cx="25" cy="29" r="7" fill="#3b82f6"/>
      <text x="45" y="25" class="outfit" fill="#17182b" font-size="21" font-weight="700">CVPR</text>
      <text x="45" y="43" class="outfit" fill="#777883" font-size="13">Computer Vision</text>
      <text x="356" y="35" text-anchor="end" class="mono" fill="#17182b" font-size="18" font-weight="650">ABSTRACT</text>
    </g>
    <g transform="translate(26 222)">
      <rect width="382" height="58" rx="16" fill="#fff" fill-opacity="0.76" stroke="#17182b" stroke-opacity="0.06"/>
      <circle cx="25" cy="29" r="7" fill="#f59e0b"/>
      <text x="45" y="25" class="outfit" fill="#17182b" font-size="21" font-weight="700">NeurIPS</text>
      <text x="45" y="43" class="outfit" fill="#777883" font-size="13">Machine Learning</text>
      <text x="356" y="35" text-anchor="end" class="mono" fill="#17182b" font-size="18" font-weight="650">DATES</text>
    </g>
  </g>

  <g transform="translate(76 547)">
    <rect width="243" height="39" rx="19.5" fill="#17182b"/>
    <text x="20" y="26" class="outfit" fill="#fff" font-size="16" font-weight="620">27+ conference series</text>
    <circle cx="218" cy="19.5" r="5" fill="#ff5d4d"/>
    <text x="276" y="26" class="outfit" fill="#6e6e78" font-size="17" font-weight="520">awsaf49.github.io/paperrush</text>
  </g>
</svg>
